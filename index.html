<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pastel dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #fafafa;
        }
        /* Unified Pink & Purple Pastel Palette */
        .pastel-pink-1 { background-color: #ffd6e0; }
        .pastel-pink-2 { background-color: #ffeff2; }
        .pastel-purple-1 { background-color: #e8dbfc; }
        .pastel-purple-2 { background-color: #f3ebff; }
        .pastel-orchid { background-color: #fbcbf5; }
        
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-700 font-sans">

    <header class="sticky top-0 z-50 bg-white border-b border-gray-100 px-4 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-3">
            <div class="flex items-center justify-between w-full lg:w-auto">
                <h1 class="text-xl font-bold tracking-tight text-gray-800">my deck 🌸</h1>
                <span id="task-count" class="lg:hidden px-2.5 py-0.5 text-xs font-semibold rounded-full pastel-purple-1">0 tasks</span>
            </div>
            
            <form id="todo-form" class="flex flex-col sm:flex-row w-full lg:max-w-4xl gap-2">
                <input 
                    type="text" 
                    id="todo-input" 
                    placeholder="what's next?" 
                    required
                    class="flex-1 min-w-[180px] px-4 py-2.5 text-sm lowercase bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all"
                >
                <div class="flex gap-2 flex-1 sm:flex-none">
                    <input 
                        type="date" 
                        id="todo-date"
                        required
                        class="w-full sm:w-auto px-3 py-2.5 text-sm bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all text-gray-500"
                    >
                    <input 
                        type="time" 
                        id="todo-time"
                        class="w-full sm:w-auto px-3 py-2.5 text-sm bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all text-gray-500"
                    >
                </div>
                <button 
                    type="submit" 
                    class="px-5 py-2.5 text-sm font-semibold text-gray-700 rounded-xl pastel-pink-1 hover:opacity-90 active:scale-95 transition-all cursor-pointer whitespace-nowrap"
                >
                    add task
                </button>
            </form>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto p-4 gap-4">
        
        <section class="hidden md:flex flex-col flex-1 bg-white rounded-2xl p-6 shadow-sm border border-gray-100 overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 id="calendar-month-year" class="text-lg font-bold text-gray-800 lowercase">...</h2>
                <div class="flex gap-1">
                    <button onclick="changeMonth(-1)" class="p-2 text-sm font-bold bg-gray-50 hover:bg-purple-50 rounded-xl border border-gray-100 transition-colors cursor-pointer text-gray-500">‹</button>
                    <button onclick="changeMonth(1)" class="p-2 text-sm font-bold bg-gray-50 hover:bg-purple-50 rounded-xl border border-gray-100 transition-colors cursor-pointer text-gray-500">›</button>
                </div>
            </div>
            <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-gray-400 mb-2">
                <div>sun</div><div>mon</div><div>tue</div><div>wed</div><div>thu</div><div>fri</div><div>sat</div>
            </div>
            <div id="calendar-days" class="grid grid-cols-7 gap-2 flex-1 auto-rows-fr overflow-y-auto no-scrollbar">
                </div>
        </section>

        <section class="w-full md:w-85 flex flex-col bg-white rounded-2xl p-6 shadow-sm border border-gray-100 overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-800">timeline</h2>
                <span id="desktop-task-count" class="hidden md:inline-block px-2.5 py-0.5 text-xs font-semibold rounded-full pastel-purple-1">0 tasks</span>
            </div>
            
            <div id="loading-state" class="text-center py-8 text-sm text-gray-400">loading your deck...</div>
            
            <ul id="todo-list" class="space-y-3 flex-1 overflow-y-auto no-scrollbar hidden">
                </ul>
        </section>

    </main>

    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = 'https://rvuidgtkyerxhbiknznr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dWlkZ3RreWVyeGhiaWtuem5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjA2MTUsImV4cCI6MjA5NTY5NjYxNX0.D_a_Ez5PHNnANp9O_zPeZbztphBP2pBHtLDN67-Ren4';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- DOM ELEMENTS ---
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoDate = document.getElementById('todo-date');
        const todoTime = document.getElementById('todo-time');
        const todoList = document.getElementById('todo-list');
        const loadingState = document.getElementById('loading-state');
        const mobileTaskCount = document.getElementById('task-count');
        const desktopTaskCount = document.getElementById('desktop-task-count');
        const calendarDays = document.getElementById('calendar-days');
        const calendarMonthYear = document.getElementById('calendar-month-year');

        const pinkPurpleColors = ['pastel-pink-1', 'pastel-purple-1', 'pastel-orchid', 'pastel-pink-2', 'pastel-purple-2'];

        const actualToday = new Date();
        let displayDate = new Date(); 

        todoDate.value = actualToday.toISOString().split('T')[0];
        let globalTodosCache = [];

        // --- HELPER FUNCTIONS ---
        
        function format12Hour(timeStr) {
            if (!timeStr) return '';
            const [hours, minutes] = timeStr.split(':');
            let h = parseInt(hours);
            const ampm = h >= 12 ? 'pm' : 'am';
            h = h % 12 || 12;
            return `${h}:${minutes} ${ampm}`;
        }

        function getCountdownText(dueDateStr) {
            if (!dueDateStr) return '';
            const targetDate = new Date(dueDateStr.split(' ')[0]);
            const todayClean = new Date(actualToday.getFullYear(), actualToday.getMonth(), actualToday.getDate());
            
            const differenceInTime = targetDate.getTime() - todayClean.getTime();
            const differenceInDays = Math.ceil(differenceInTime / (1000 * 3600 * 24));
            
            if (differenceInDays === 0) return '📍 today';
            if (differenceInDays === 1) return '⏳ tomorrow';
            if (differenceInDays < 0) return '⚠️ overdue';
            return `✨ ${differenceInDays} days left`;
        }

        // --- CORE APPLICATION LOGIC ---

        async function fetchTodos() {
            // Instantly render calendar layout shells so the interface is never blank while fetching data
            renderCalendarGrid();

            if (SUPABASE_URL.includes('rvuidgtkyerxhbiknznr')) {
                loadingState.textContent = 'update your supabase credentials inside the script block.';
                return;
            }

            const { data, error } = await supabaseClient
                .from('todos')
                .select('*')
                .order('due_date', { ascending: true });

            if (error) {
                console.error('Error fetching data:', error);
                loadingState.textContent = 'database link failed.';
                return;
            }
            
            globalTodosCache = data;
            renderDashboard();
        }

        function renderDashboard() {
            todoList.innerHTML = '';
            loadingState.classList.add('hidden');
            todoList.classList.remove('hidden');
            
            const countStr = `${globalTodosCache.length} task${globalTodosCache.length === 1 ? '' : 's'}`;
            mobileTaskCount.textContent = countStr;
            desktopTaskCount.textContent = countStr;

            globalTodosCache.forEach((todo, index) => {
                const colorClass = pinkPurpleColors[index % pinkPurpleColors.length];
                const parts = todo.due_date ? todo.due_date.split(' ') : [];
                const displayTime = parts[1] ? format12Hour(parts[1]) : '';
                const countdown = todo.is_completed ? '✅ done' : getCountdownText(todo.due_date);

                const li = document.createElement('li');
                li.id = `task-card-${todo.id}`;
                li.className = `flex flex-col p-4 rounded-xl border border-black/5 transition-all ${colorClass} ${todo.is_completed ? 'opacity-40 line-through' : ''}`;
                
                li.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div id="title-container-${todo.id}" class="flex-1 text-sm font-semibold lowercase cursor-pointer break-all" onclick="toggleTodo('${todo.id}', ${todo.is_completed})">
                            ${todo.title}
                        </div>
                        <div class="flex items-center gap-1.5 ml-2 shrink-0">
                            <button onclick="event.stopPropagation(); enableInlineEdit('${todo.id}', '${todo.title.replace(/'/g, "\\'")}')" class="text-gray-400 hover:text-purple-600 transition-colors text-xs font-bold px-1 cursor-pointer" title="edit description">
                                ✎
                            </button>
                            <button onclick="event.stopPropagation(); deleteTodo('${todo.id}')" class="text-gray-400 hover:text-rose-400 transition-colors text-xs font-bold px-1 cursor-pointer">
                                ✕
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mt-2 text-[11px] font-medium text-purple-950/60 tracking-tight">
                        <span class="opacity-70">${displayTime ? '🕒 ' + displayTime : '📅 full day'}</span>
                        <span class="bg-white/60 px-2 py-0.5 rounded-md font-bold shadow-2xs">${countdown}</span>
                    </div>
                `;
                todoList.appendChild(li);
            });

            renderCalendarGrid();
        }

        // Inline Text Field Form Generation
        window.enableInlineEdit = function(id, currentTitle) {
            const container = document.getElementById(`title-container-${id}`);
            
            // Generate inline editing element block
            container.removeAttribute('onclick'); 
            container.innerHTML = `
                <div class="flex gap-1.5 w-full mt-0.5" onclick="event.stopPropagation();">
                    <input 
                        type="text" 
                        id="edit-input-${id}" 
                        value="${currentTitle}" 
                        class="w-full px-2 py-1 text-xs lowercase bg-white/80 border border-purple-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-purple-400 font-normal"
                    >
                    <button onclick="saveInlineEdit('${id}')" class="px-2 py-1 text-[10px] font-bold text-white bg-purple-500 rounded-lg hover:bg-purple-600 shadow-2xs cursor-pointer">save</button>
                    <button onclick="fetchTodos()" class="px-2 py-1 text-[10px] font-bold bg-white/50 rounded-lg hover:bg-white shadow-2xs border border-black/5 cursor-pointer">cancel</button>
                </div>
            `;
            
            // Instantly auto focus the target element
            document.getElementById(`edit-input-${id}`).focus();
        };

        // Save modification to database
        window.saveInlineEdit = async function(id) {
            const inputField = document.getElementById(`edit-input-${id}`);
            const updatedTitle = inputField.value.trim().toLowerCase();
            
            if (!updatedTitle) return;

            const { error } = await supabaseClient
                .from('todos')
                .update({ title: updatedTitle })
                .eq('id', id);

            if (error) {
                console.error('Error updating text content:', error);
                alert('failed to update text content.');
            } else {
                fetchTodos();
            }
        };

        function renderCalendarGrid() {
            calendarDays.innerHTML = '';
            
            const viewYear = displayDate.getFullYear();
            const viewMonth = displayDate.getMonth();

            const monthNames = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
            calendarMonthYear.textContent = `${monthNames[viewMonth]} ${viewYear}`;

            const firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
            const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const blank = document.createElement('div');
                blank.className = "bg-purple-50/10 rounded-xl border border-dashed border-purple-100/40 min-h-[90px]";
                calendarDays.appendChild(blank);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayBox = document.createElement('div');
                const isRealToday = day === actualToday.getDate() && viewMonth === actualToday.getMonth() && viewYear === actualToday.getFullYear();
                
                const currentDayString = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayTasks = globalTodosCache.filter(t => t.due_date && t.due_date.startsWith(currentDayString));

                dayBox.className = `p-2 rounded-xl border border-gray-100 flex flex-col items-start justify-between text-left text-xs font-medium transition-all min-h-[90px] overflow-hidden ${isRealToday ? 'bg-purple-50 border-purple-300 ring-2 ring-purple-100/50' : 'bg-gray-50/30'}`;
                
                let tasksContainerHtml = '<div class="w-full space-y-1 mt-1 max-h-[60px] overflow-y-auto no-scrollbar">';
                dayTasks.forEach(task => {
                    const parts = task.due_date.split(' ');
                    const timeLabel = parts[1] ? format12Hour(parts[1]) : '';
                    tasksContainerHtml += `
                        <div class="text-[10px] truncate px-1.5 py-0.5 rounded bg-purple-100/70 text-purple-800 border border-purple-200/30 leading-tight ${task.is_completed ? 'line-through opacity-40' : ''}" title="${task.title}">
                            ${timeLabel ? `<span class="font-bold opacity-80">${timeLabel}</span> ` : ''}${task.title}
                        </div>
                    `;
                });
                tasksContainerHtml += '</div>';

                dayBox.innerHTML = `
                    <span class="${isRealToday ? 'text-purple-700 font-bold' : 'text-gray-400'}">${day}</span>
                    ${tasksContainerHtml}
                `;
                
                calendarDays.appendChild(dayBox);
            }
        }

        window.changeMonth = function(direction) {
            displayDate.setMonth(displayDate.getMonth() + direction);
            renderCalendarGrid();
        };

        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = todoInput.value.trim().toLowerCase();
            const dateVal = todoDate.value;
            const timeVal = todoTime.value;
            
            if (!title || !dateVal) return;

            const compositeDeadlineString = timeVal ? `${dateVal} ${timeVal}` : dateVal;

            const { error } = await supabaseClient
                .from('todos')
                .insert([{ title, is_completed: false, due_date: compositeDeadlineString }]);

            if (error) {
                console.error('Error adding data:', error);
                alert('failed to add task.');
            } else {
                todoInput.value = '';
                todoTime.value = '';
                fetchTodos();
            }
        });

        window.toggleTodo = async function(id, currentStatus) {
            const { error } = await supabaseClient
                .from('todos')
                .update({ is_completed: !currentStatus })
                .eq('id', id);

            if (error) console.error('Error updating status:', error);
            else fetchTodos();
        };

        window.deleteTodo = async function(id) {
            const { error } = await supabaseClient
                .from('todos')
                .delete()
                .eq('id', id);

            if (error) console.error('Error removing entry:', error);
            else fetchTodos();
        };

        // Run instantly on layout insertion initialization
        fetchTodos();
    </script>
</body>
</html>
