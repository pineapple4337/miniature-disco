<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pastel dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f9fafb;
        }
        .pastel-pink { background-color: #ffd6e0; }
        .pastel-blue { background-color: #c1f0f6; }
        .pastel-green { background-color: #d8f3dc; }
        .pastel-purple { background-color: #e8dbfc; }
        .pastel-yellow { background-color: #fefae0; }
        
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-700 font-sans">

    <header class="sticky top-0 z-50 bg-white border-b border-gray-100 px-4 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center justify-between w-full sm:w-auto">
                <h1 class="text-xl font-bold tracking-tight text-gray-800">my deck 🌸</h1>
                <span id="task-count" class="sm:hidden px-2.5 py-0.5 text-xs font-semibold rounded-full pastel-purple">0 tasks</span>
            </div>
            
            <form id="todo-form" class="flex w-full sm:max-w-md gap-2">
                <input 
                    type="text" 
                    id="todo-input" 
                    placeholder="what's next?" 
                    required
                    class="flex-1 px-4 py-2.5 text-sm lowercase bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all"
                >
                <button 
                    type="submit" 
                    class="px-5 py-2.5 text-sm font-semibold text-gray-700 rounded-xl pastel-pink hover:opacity-90 active:scale-95 transition-all cursor-pointer whitespace-nowrap"
                >
                    add task
                </button>
            </form>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto p-4 gap-4">
        
        <section class="hidden md:flex flex-col flex-1 bg-white rounded-2xl p-6 shadow-sm border border-gray-100 overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 id="calendar-month-year" class="text-lg font-bold text-gray-800">may 2026</h2>
            </div>
            <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-gray-400 mb-2">
                <div>sun</div><div>mon</div><div>tue</div><div>wed</div><div>thu</div><div>fri</div><div>sat</div>
            </div>
            <div id="calendar-days" class="grid grid-cols-7 gap-2 flex-1 auto-rows-fr">
                </div>
        </section>

        <section class="w-full md:w-80 flex flex-col bg-white rounded-2xl p-6 shadow-sm border border-gray-100 overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-800">timeline</h2>
                <span id="desktop-task-count" class="hidden md:inline-block px-2.5 py-0.5 text-xs font-semibold rounded-full pastel-purple">0 tasks</span>
            </div>
            
            <div id="loading-state" class="text-center py-8 text-sm text-gray-400">loading your deck...</div>
            
            <ul id="todo-list" class="space-y-3 flex-1 overflow-y-auto no-scrollbar hidden">
                </ul>
        </section>

    </main>

    <script>
        // --- SUPABASE CONFIGURATION ---
        // Just insert your unique project reference id right between 'https://' and '.supabase.co'
        const SUPABASE_URL = 'https://rvuidgtkyerxhbiknznr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dWlkZ3RreWVyeGhiaWtuem5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjA2MTUsImV4cCI6MjA5NTY5NjYxNX0.D_a_Ez5PHNnANp9O_zPeZbztphBP2pBHtLDN67-Ren4';
        
        // Fixed: Renamed to avoid syntax collision with the global library object
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- DOM ELEMENTS ---
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const loadingState = document.getElementById('loading-state');
        const mobileTaskCount = document.getElementById('task-count');
        const desktopTaskCount = document.getElementById('desktop-task-count');
        const calendarDays = document.getElementById('calendar-days');
        const calendarMonthYear = document.getElementById('calendar-month-year');

        const pastelColors = ['pastel-pink', 'pastel-blue', 'pastel-green', 'pastel-purple', 'pastel-yellow'];

        // Get current date context for the display calendar
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth(); 

        // --- FUNCTIONS ---
        
        // Fetch tasks chronologically (newest created first)
        async function fetchTodos() {
            const { data, error } = await supabaseClient
                .from('todos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching data:', error);
                loadingState.textContent = 'database link failed.';
                return;
            }

            renderDashboard(data);
        }

        // Render both the sidebar and the background dashboard elements
        function renderDashboard(todos) {
            todoList.innerHTML = '';
            loadingState.classList.add('hidden');
            todoList.classList.remove('hidden');
            
            const countStr = `${todos.length} task${todos.length === 1 ? '' : 's'}`;
            mobileTaskCount.textContent = countStr;
            desktopTaskCount.textContent = countStr;

            // Render Chronological Timeline
            todos.forEach((todo, index) => {
                const colorClass = pastelColors[index % pastelColors.length];
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-3.5 rounded-xl border border-black/5 transition-all ${colorClass} ${todo.is_completed ? 'opacity-40 line-through' : ''}`;
                
                li.innerHTML = `
                    <span class="text-sm font-medium lowercase cursor-pointer flex-1" onclick="toggleTodo('${todo.id}', ${todo.is_completed})">
                        ${todo.title}
                    </span>
                    <button onclick="deleteTodo('${todo.id}')" class="text-gray-400 hover:text-rose-400 transition-colors cursor-pointer text-xs font-bold px-1 ml-2">
                        ✕
                    </button>
                `;
                todoList.appendChild(li);
            });

            renderCalendarGrid(todos);
        }

        // Generate a visual background grid context for the desktop homepage
        function renderCalendarGrid(todos) {
            calendarDays.innerHTML = '';
            
            const monthNames = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
            calendarMonthYear.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Padding items for previous month overhang
            for (let i = 0; i < firstDayIndex; i++) {
                const blank = document.createElement('div');
                blank.className = "bg-gray-50/50 rounded-xl border border-dashed border-gray-100";
                calendarDays.appendChild(blank);
            }

            // Fill actual month days
            for (let day = 1; day <= totalDays; day++) {
                const dayBox = document.createElement('div');
                const isToday = day === now.getDate() && currentMonth === now.getMonth();
                
                dayBox.className = `p-2 rounded-xl border border-gray-100 flex flex-col items-start justify-between text-left text-xs font-medium transition-all ${isToday ? 'bg-amber-50/70 border-amber-200 ring-2 ring-amber-100' : 'bg-gray-50/30'}`;
                dayBox.innerHTML = `<span class="${isToday ? 'text-amber-700 font-bold' : 'text-gray-400'}">${day}</span>`;
                
                calendarDays.appendChild(dayBox);
            }
        }

        // Insert task directly through top bar
        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = todoInput.value.trim().toLowerCase();
            if (!title) return;

            const { error } = await supabaseClient
                .from('todos')
                .insert([{ title, is_completed: false }]);

            if (error) {
                console.error('Error adding data:', error);
                alert('failed to add task. ensure rls policies are open.');
            } else {
                todoInput.value = '';
                fetchTodos();
            }
        });

        // Event hooks
        window.toggleTodo = async function(id, currentStatus) {
            const { error } = await supabaseClient
                .from('todos')
                .update({ is_completed: !currentStatus })
                .eq('id', id);

            if (error) console.error('Error updating status:', error);
            else fetchTodos();
        };

        window.deleteTodo = async function(id) {
            const { error } = await supabaseClient
                .from('todos')
                .delete()
                .eq('id', id);

            if (error) console.error('Error removing entry:', error);
            else fetchTodos();
        };

        // Run initial configuration checks
        if (SUPABASE_URL !== 'https://rvuidgtkyerxhbiknznr.supabase.co') {
            fetchTodos();
        } else {
            loadingState.textContent = 'insert your credentials in the file script block to connect.';
        }
    </script>
</body>
</html>
