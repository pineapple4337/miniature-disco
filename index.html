<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pastel task tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f3f4f6;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .pastel-pink { background-color: #ffd6e0; }
        .pastel-blue { background-color: #c1f0f6; }
        .pastel-green { background-color: #d8f3dc; }
        .pastel-purple { background-color: #e8dbfc; }
        .pastel-yellow { background-color: #fefae0; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-gray-700">

    <div class="w-full max-w-md p-6 bg-white shadow-xl rounded-2xl border border-gray-100">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-gray-800">my tasks 🌸</h1>
            <span id="task-count" class="px-3 py-1 text-xs font-semibold rounded-full pastel-purple">0 tasks</span>
        </div>

        <form id="todo-form" class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="todo-input" 
                placeholder="what's next?" 
                required
                class="flex-1 px-4 py-3 text-sm lowercase bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all"
            >
            <button 
                type="submit" 
                class="px-5 py-3 text-sm font-semibold text-gray-700 rounded-xl pastel-pink hover:opacity-90 active:scale-95 transition-all cursor-pointer"
            >
                add
            </button>
        </form>

        <div id="loading-state" class="text-center py-4 text-sm text-gray-400">loading your deck...</div>
        <ul id="todo-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-1 hidden">
            </ul>
    </div>

    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- DOM ELEMENTS ---
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const loadingState = document.getElementById('loading-state');
        const taskCount = document.getElementById('task-count');

        const pastelColors = ['pastel-pink', 'pastel-blue', 'pastel-green', 'pastel-purple', 'pastel-yellow'];

        // --- FUNCTIONS ---
        
        // Fetch tasks from your schema
        async function fetchTodos() {
            const { data, error } = await supabase
                .from('todos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching data:', error);
                loadingState.textContent = 'database error. check console or RLS policies.';
                return;
            }

            renderTodos(data);
        }

        // Render tasks into the UI
        function renderTodos(todos) {
            todoList.innerHTML = '';
            loadingState.classList.add('hidden');
            todoList.classList.remove('hidden');
            taskCount.textContent = `${todos.length} task${todos.length === 1 ? '' : 's'}`;

            todos.forEach((todo, index) => {
                const colorClass = pastelColors[index % pastelColors.length];
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-4 rounded-xl border border-black/5 transition-all ${colorClass} ${todo.is_completed ? 'opacity-50 line-through' : ''}`;
                
                li.innerHTML = `
                    <span class="text-sm font-medium lowercase cursor-pointer flex-1" onclick="toggleTodo('${todo.id}', ${todo.is_completed})">
                        ${todo.title}
                    </span>
                    <button onclick="deleteTodo('${todo.id}')" class="text-gray-400 hover:text-rose-400 transition-colors cursor-pointer text-sm font-bold px-1 ml-2">
                        ✕
                    </button>
                `;
                todoList.appendChild(li);
            });
        }

        // Insert new task into your table
        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = todoInput.value.trim().toLowerCase();
            if (!title) return;

            const { error } = await supabase
                .from('todos')
                .insert([{ title, is_completed: false }]);

            if (error) {
                console.error('Error adding data:', error);
                alert('could not save task. check console.');
            } else {
                todoInput.value = '';
                fetchTodos();
            }
        });

        // Globally exposed action handlers
        window.toggleTodo = async function(id, currentStatus) {
            const { error } = await supabase
                .from('todos')
                .update({ is_completed: !currentStatus })
                .eq('id', id);

            if (error) {
                console.error('Error updating data:', error);
            } else {
                fetchTodos();
            }
        };

        window.deleteTodo = async function(id) {
            const { error } = await supabase
                .from('todos')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Error deleting data:', error);
            } else {
                fetchTodos();
            }
        };

        // Initialize application on load
        if (SUPABASE_URL !== 'YOUR_SUPABASE_PROJECT_URL') {
            fetchTodos();
        } else {
            loadingState.textContent = 'please configure your supabase keys inside the script tag.';
        }
    </script>
</body>
</html>
