<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pastel dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="my deck">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23ffd6e0'/><stop offset='100%25' stop-color='%23e8dbfc'/></linearGradient></defs><rect width='180' height='180' rx='40' fill='url(%23g)'/></svg>">

    <style>
        body {
            background-color: #fafafa;
        }
        /* Unified Pink & Purple Pastel Palette */
        .pastel-pink-1 { background-color: #ffd6e0; }
        .pastel-pink-2 { background-color: #ffeff2; }
        .pastel-purple-1 { background-color: #e8dbfc; }
        .pastel-purple-2 { background-color: #f3ebff; }
        .pastel-orchid { background-color: #fbcbf5; }
        
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Lock mobile outer viewport layout completely static while preserving native desktop rules */
        @media (max-width: 767px) {
            html, body {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 100% !important;
                overflow: hidden !important;
                overscroll-behavior: none;
            }
        }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-700 font-sans">

    <header class="sticky top-0 z-40 bg-white border-b border-gray-100 px-4 py-3 shadow-sm shrink-0">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-3">
            <div class="flex items-center justify-between w-full lg:w-auto">
                <h1 class="text-xl font-bold tracking-tight text-gray-800">my deck 🌸</h1>
                <span id="task-count" class="lg:hidden px-2.5 py-0.5 text-xs font-semibold rounded-full pastel-purple-1">0 tasks</span>
            </div>
            
            <form id="todo-form" class="flex flex-col sm:flex-row w-full lg:max-w-4xl gap-2">
                <input 
                    type="text" 
                    id="todo-input" 
                    placeholder="what's next?" 
                    required
                    class="flex-1 min-w-[180px] px-4 py-2.5 text-sm lowercase bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all"
                >
                <div class="flex gap-2 flex-1 sm:flex-none">
                    <input 
                        type="date" 
                        id="todo-date"
                        required
                        class="w-full sm:w-auto px-3 py-2.5 text-sm bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all text-gray-500"
                    >
                    <input 
                        type="time" 
                        id="todo-time"
                        class="w-full sm:w-auto px-3 py-2.5 text-sm bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all text-gray-500"
                    >
                </div>
                <button 
                    type="submit" 
                    class="px-5 py-2.5 text-sm font-semibold text-gray-700 rounded-xl pastel-pink-1 hover:opacity-90 active:scale-95 transition-all cursor-pointer whitespace-nowrap"
                >
                    add task
                </button>
            </form>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto p-4 gap-4 min-h-0">
        
        <section class="hidden md:flex flex-col flex-1 bg-white rounded-2xl p-6 shadow-sm border border-gray-100 overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 id="calendar-month-year" class="text-lg font-bold text-gray-800 lowercase">...</h2>
                <div class="flex gap-1">
                    <button onclick="changeMonth(-1)" class="p-2 text-sm font-bold bg-gray-50 hover:bg-purple-50 rounded-xl border border-gray-100 transition-colors cursor-pointer text-gray-500">‹</button>
                    <button onclick="changeMonth(1)" class="p-2 text-sm font-bold bg-gray-50 hover:bg-purple-50 rounded-xl border border-gray-100 transition-colors cursor-pointer text-gray-500">›</button>
                </div>
            </div>
            <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-gray-400 mb-2">
                <div>sun</div><div>mon</div><div>tue</div><div>wed</div><div>thu</div><div>fri</div><div>sat</div>
            </div>
            <div id="calendar-days" class="grid grid-cols-7 gap-2 flex-1 auto-rows-fr overflow-y-auto no-scrollbar">
                </div>
        </section>

        <section class="w-full md:w-85 flex flex-col bg-white rounded-2xl p-6 shadow-sm border border-gray-100 overflow-hidden h-full">
            <div class="flex items-center justify-between mb-4 shrink-0">
                <h2 class="text-lg font-bold text-gray-800">timeline</h2>
                <span id="desktop-task-count" class="hidden md:inline-block px-2.5 py-0.5 text-xs font-semibold rounded-full pastel-purple-1">0 tasks</span>
            </div>
            
            <div id="loading-state" class="text-center py-8 text-sm text-gray-400 shrink-0">loading your deck...</div>
            
            <ul id="todo-list" class="space-y-3 flex-1 overflow-y-auto no-scrollbar hidden pb-8">
                </ul>
        </section>

    </main>

    <div id="task-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/20 backdrop-blur-xs transition-opacity">
        <div class="w-full max-w-md max-h-[90vh] md:max-h-none h-full md:h-auto p-6 bg-white rounded-2xl shadow-xl border border-gray-100 flex flex-col gap-4">
            <div class="flex items-center justify-between border-b border-gray-50 pb-2">
                <h3 class="text-md font-bold text-gray-800">task details 📌</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-sm cursor-pointer">✕</button>
            </div>
            
            <input type="hidden" id="modal-task-id">
            
            <div class="space-y-3 flex-1 flex flex-col overflow-y-auto no-scrollbar w-full min-w-0">
                <div>
                    <label class="text-xs font-bold text-purple-900/40 lowercase block mb-1">description</label>
                    <input type="text" id="modal-task-title" class="w-full px-3 py-2 text-sm lowercase bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all">
                </div>
                
                <div class="flex w-full gap-2 table-layout-fixed">
                    <div style="width: 50%; min-width: 0;">
                        <label class="text-xs font-bold text-purple-900/40 lowercase block mb-1">due date</label>
                        <input type="date" id="modal-task-date" class="w-full box-border px-2 py-2 text-sm bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all text-gray-600">
                    </div>
                    <div style="width: 50%; min-width: 0;">
                        <label class="text-xs font-bold text-purple-900/40 lowercase block mb-1">time (optional)</label>
                        <input type="time" id="modal-task-time" class="w-full box-border px-2 py-2 text-sm bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all text-gray-600">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-bold text-purple-900/40 lowercase">progress</label>
                        <span id="modal-slider-value" class="text-xs font-bold text-purple-600">0%</span>
                    </div>
                    <div class="flex items-center gap-3 bg-gray-50 px-3 py-2.5 rounded-xl">
                        <input 
                            type="range" 
                            id="modal-task-progress" 
                            min="0" 
                            max="100" 
                            step="5"
                            class="w-full accent-purple-400 cursor-pointer h-1.5 bg-gray-200 rounded-lg appearance-none"
                            style="background: linear-gradient(to right, #ffd6e0 0%, #e8dbfc 0%, #e5e7eb 0%);"
                            oninput="
                                document.getElementById('modal-slider-value').textContent = this.value + '%';
                                this.style.background = `linear-gradient(to right, #ffd6e0 0%, #e8dbfc ${this.value}%, #e5e7eb ${this.value}%)`;
                            "
                        >
                    </div>
                </div>

                <div class="flex-1 flex flex-col min-h-[120px]">
                    <label class="text-xs font-bold text-purple-900/40 lowercase block mb-1">notes</label>
                    <textarea id="modal-task-notes" placeholder="add details, links, or lists here..." class="w-full flex-1 px-3 py-2.5 text-sm bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-purple-200 focus:bg-white focus:outline-none transition-all resize-none text-gray-600 placeholder-gray-300 overflow-y-auto"></textarea>
                </div>
            </div>
            
            <div class="flex items-center justify-end gap-2 mt-2">
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-semibold bg-gray-50 hover:bg-gray-100 rounded-xl cursor-pointer text-gray-500">cancel</button>
                <button onclick="saveModalChanges()" class="px-4 py-2 text-xs font-bold text-gray-700 pastel-pink-1 hover:opacity-90 rounded-xl shadow-2xs cursor-pointer">save changes</button>
            </div>
        </div>
    </div>

    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = 'https://rvuidgtkyerxhbiknznr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dWlkZ3RreWVyeGhiaWtuem5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjA2MTUsImV4cCI6MjA5NTY5NjYxNX0.D_a_Ez5PHNnANp9O_zPeZbztphBP2pBHtLDN67-Ren4';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- DOM ELEMENTS ---
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoDate = document.getElementById('todo-date');
        const todoTime = document.getElementById('todo-time');
        const todoList = document.getElementById('todo-list');
        const loadingState = document.getElementById('loading-state');
        const mobileTaskCount = document.getElementById('task-count');
        const desktopTaskCount = document.getElementById('desktop-task-count');
        const calendarDays = document.getElementById('calendar-days');
        const calendarMonthYear = document.getElementById('calendar-month-year');

        const taskModal = document.getElementById('task-modal');
        const modalTaskId = document.getElementById('modal-task-id');
        const modalTaskTitle = document.getElementById('modal-task-title');
        const modalTaskDate = document.getElementById('modal-task-date');
        const modalTaskTime = document.getElementById('modal-task-time');
        const modalTaskNotes = document.getElementById('modal-task-notes');
        const modalTaskProgress = document.getElementById('modal-task-progress');
        const modalSliderValue = document.getElementById('modal-slider-value');

        const pinkPurpleColors = ['pastel-pink-1', 'pastel-purple-1', 'pastel-orchid', 'pastel-pink-2', 'pastel-purple-2'];

        const actualToday = new Date();
        let displayDate = new Date(); 

        todoDate.value = actualToday.toISOString().split('T')[0];
        let globalTodosCache = [];

        // --- HELPER FUNCTIONS ---
        
        function format12Hour(timeStr) {
            if (!timeStr) return '';
            const [hours, minutes] = timeStr.split(':');
            let h = parseInt(hours);
            const ampm = h >= 12 ? 'pm' : 'am';
            h = h % 12 || 12;
            return `${h}:${minutes} ${ampm}`;
        }

        function getCountdownText(dueDateStr) {
            if (!dueDateStr) return '';
            
            const datePart = dueDateStr.split(' ')[0]; 
            const [year, month, day] = datePart.split('-').map(num => parseInt(num));
            
            const targetClean = new Date(year, month - 1, day).getTime();
            const todayClean = new Date(actualToday.getFullYear(), actualToday.getMonth(), actualToday.getDate()).getTime();
            
            const differenceInDays = Math.ceil((targetClean - todayClean) / (1000 * 3600 * 24));
            
            if (differenceInDays === 0) return '📍 today';
            if (differenceInDays === 1) return '⏳ tomorrow';
            if (differenceInDays < 0) return '⚠️ overdue';
            return `📌 ${differenceInDays} days left`;
        }

        // --- CORE APPLICATION LOGIC ---

        async function fetchTodos() {
            renderCalendarGrid();

            const { data, error } = await supabaseClient
                .from('todos')
                .select('*')
                .order('due_date', { ascending: true });

            if (error) {
                console.error('Error fetching data:', error);
                loadingState.textContent = 'database link failed. check your credentials.';
                return;
            }
            
            // SORTING LOGIC: Keep active tasks at the top, push completed (is_completed === true) to the bottom
            globalTodosCache = data.sort((a, b) => {
                if (a.is_completed === b.is_completed) {
                    return 0; // If both are active or both are completed, maintain the due_date order from Supabase
                }
                return a.is_completed ? 1 : -1; // Put completed items (true) after active items (false)
            });

            renderDashboard();
        }

        function renderDashboard() {
            todoList.innerHTML = '';
            loadingState.classList.add('hidden');
            todoList.classList.remove('hidden');
            
            const countStr = `${globalTodosCache.length} task${globalTodosCache.length === 1 ? '' : 's'}`;
            mobileTaskCount.textContent = countStr;
            desktopTaskCount.textContent = countStr;

            globalTodosCache.forEach((todo, index) => {
                const colorClass = pinkPurpleColors[index % pinkPurpleColors.length];
                const parts = todo.due_date ? todo.due_date.split(' ') : [];
                const displayTime = parts[1] ? format12Hour(parts[1]) : '';
                const isDone = todo.is_completed;
                const countdown = isDone ? '✅ done' : getCountdownText(todo.due_date);
                const hasNotes = todo.notes && todo.notes.trim() !== '';
                const progressPct = todo.progress !== undefined && todo.progress !== null ? todo.progress : (isDone ? 100 : 0);

                const li = document.createElement('li');
                li.id = `task-card-${todo.id}`;
                li.className = `flex gap-3 items-start p-4 rounded-xl border border-black/5 transition-all cursor-pointer ${colorClass} ${isDone ? 'opacity-40 line-through' : ''}`;
                li.onclick = () => openModal(todo.id);
                
                li.innerHTML = `
                    <div 
                        onclick="event.stopPropagation(); fastToggleTodo('${todo.id}', ${isDone})" 
                        class="w-5 h-5 rounded-full border-2 border-purple-950/20 bg-white/80 flex items-center justify-center font-bold text-[10px] text-purple-700 select-none shrink-0 mt-0.5 hover:bg-purple-100 transition-colors"
                    >
                        ${isDone ? '✓' : ''}
                    </div>

                    <div class="flex-1 min-w-0">
                        <div class="flex items-start justify-between gap-2">
                            <div class="text-sm font-semibold lowercase break-all">
                                ${todo.title} ${hasNotes ? '<span class="text-[10px] ml-1">📝</span>' : ''}
                            </div>
                            <button onclick="event.stopPropagation(); deleteTodo('${todo.id}')" class="text-gray-400 hover:text-rose-400 transition-colors text-xs font-bold px-1 cursor-pointer shrink-0 inline-block line-none decoration-transparent">
                                ✕
                            </button>
                        </div>
                        <div class="flex items-center justify-between mt-2 text-[11px] font-medium tracking-tight text-purple-950/60">
                            <div class="flex items-center gap-2">
                                <span>${displayTime ? '🕒 ' + displayTime : '📅 full day'}</span>
                                ${!isDone && progressPct > 0 ? `<span class="text-[10px] bg-purple-500/10 text-purple-700 px-1.5 py-0.2 rounded font-bold">${progressPct}%</span>` : ''}
                            </div>
                            <span class="bg-white/60 px-2 py-0.5 rounded-md font-bold shadow-2xs">${countdown}</span>
                        </div>
                    </div>
                `;
                todoList.appendChild(li);
            });

            renderCalendarGrid();
        }

        window.openModal = function(id) {
            const todo = globalTodosCache.find(t => t.id === id);
            if (!todo) return;

            modalTaskId.value = todo.id;
            modalTaskTitle.value = todo.title;
            modalTaskNotes.value = todo.notes || '';
            
            const parts = todo.due_date ? todo.due_date.split(' ') : ['', ''];
            modalTaskDate.value = parts[0] || '';
            modalTaskTime.value = parts[1] || '';

            const currentProgress = todo.progress !== undefined && todo.progress !== null ? todo.progress : (todo.is_completed ? 100 : 0);
            modalTaskProgress.value = currentProgress;
            modalSliderValue.textContent = currentProgress + '%';
            
            // Set slider track color initialization split state cleanly
            modalTaskProgress.style.background = `linear-gradient(to right, #ffd6e0 0%, #e8dbfc ${currentProgress}%, #e5e7eb ${currentProgress}%)`;

            taskModal.classList.remove('hidden');
        };

        window.closeModal = function() {
            taskModal.classList.add('hidden');
        };

        window.saveModalChanges = async function() {
            const id = modalTaskId.value;
            const updatedTitle = modalTaskTitle.value.trim().toLowerCase();
            const dateVal = modalTaskDate.value;
            const timeVal = modalTaskTime.value;
            const updatedNotes = modalTaskNotes.value;
            const progressVal = parseInt(modalTaskProgress.value);

            if (!updatedTitle || !dateVal) {
                alert('description and date are required fields.');
                return;
            }

            const compositeDeadlineString = timeVal ? `${dateVal} ${timeVal}` : dateVal;
            const targetCompletionBoolean = (progressVal === 100);

            const { error } = await supabaseClient
                .from('todos')
                .update({ 
                    title: updatedTitle, 
                    due_date: compositeDeadlineString,
                    notes: updatedNotes,
                    progress: progressVal,
                    is_completed: targetCompletionBoolean
                })
                .eq('id', id);

            if (error) {
                console.error('Error saving records:', error);
                alert('failed to save records.');
            } else {
                closeModal();
                fetchTodos();
            }
        };

        window.fastToggleTodo = async function(id, currentStatus) {
            const nextStatus = !currentStatus;
            const { error } = await supabaseClient
                .from('todos')
                .update({ 
                    is_completed: nextStatus,
                    progress: nextStatus ? 100 : 0
                })
                .eq('id', id);

            if (error) console.error('Error tracking quick toggle change state:', error);
            else fetchTodos();
        };

        function renderCalendarGrid() {
            calendarDays.innerHTML = '';
            
            const viewYear = displayDate.getFullYear();
            const viewMonth = displayDate.getMonth();

            const monthNames = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
            calendarMonthYear.textContent = `${monthNames[viewMonth]} ${viewYear}`;

            const firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
            const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const blank = document.createElement('div');
                blank.className = "bg-purple-50/10 rounded-xl border border-dashed border-purple-100/40 min-h-[90px]";
                calendarDays.appendChild(blank);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayBox = document.createElement('div');
                const isRealToday = day === actualToday.getDate() && viewMonth === actualToday.getMonth() && viewYear === actualToday.getFullYear();
                
                const currentDayString = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayTasks = globalTodosCache.filter(t => t.due_date && t.due_date.startsWith(currentDayString));

                dayBox.className = `p-2 rounded-xl border border-gray-100 flex flex-col items-start justify-between text-left text-xs font-medium transition-all min-h-[90px] overflow-hidden ${isRealToday ? 'bg-purple-50 border-purple-300 ring-2 ring-purple-100/50' : 'bg-gray-50/30'}`;
                
                let tasksContainerHtml = '<div class="w-full space-y-1 mt-1 max-h-[60px] overflow-y-auto no-scrollbar">';
                dayTasks.forEach(task => {
                    const parts = task.due_date.split(' ');
                    const timeLabel = parts[1] ? format12Hour(parts[1]) : '';
                    tasksContainerHtml += `
                        <div onclick="event.stopPropagation(); openModal('${task.id}')" class="text-[10px] truncate px-1.5 py-0.5 rounded bg-purple-100/70 text-purple-800 border border-purple-200/30 leading-tight cursor-pointer hover:bg-purple-200 transition-colors ${task.is_completed ? 'line-through opacity-40' : ''}" title="${task.title}">
                            ${timeLabel ? `<span class="font-bold opacity-80">${timeLabel}</span> ` : ''}${task.title}
                        </div>
                    `;
                });
                tasksContainerHtml += '</div>';

                dayBox.innerHTML = `
                    <span class="${isRealToday ? 'text-purple-700 font-bold' : 'text-gray-400'}">${day}</span>
                    ${tasksContainerHtml}
                `;
                
                calendarDays.appendChild(dayBox);
            }
        }

        window.changeMonth = function(direction) {
            displayDate.setMonth(displayDate.getMonth() + direction);
            renderCalendarGrid();
        };

        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = todoInput.value.trim().toLowerCase();
            const dateVal = todoDate.value;
            const timeVal = todoTime.value;
            
            if (!title || !dateVal) return;

            const compositeDeadlineString = timeVal ? `${dateVal} ${timeVal}` : dateVal;

            const { error } = await supabaseClient
                .from('todos')
                .insert([{ title, is_completed: false, due_date: compositeDeadlineString, notes: '', progress: 0 }]);

            if (error) {
                console.error('Error adding data:', error);
                alert('failed to add task.');
            } else {
                todoInput.value = '';
                todoTime.value = '';
                fetchTodos();
            }
        });

        window.deleteTodo = async function(id) {
            const { error } = await supabaseClient
                .from('todos')
                .delete()
                .eq('id', id);

            if (error) console.error('Error removing entry:', error);
            else fetchTodos();
        };

        fetchTodos();
    </script>
</body>
</html>
